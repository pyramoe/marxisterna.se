baseURL: https://marxisterna.se/
locale: sv-SE
defaultContentLanguage: sv
title: Marxisterna
enableRobotsTXT: true
disableKinds:
  - taxonomy
  - term

params:
  description: En förening som vill stärka vänsterns ideologiska grund genom marxism, radikalfeminism, antirasism och antiimperialism.

menus:
  main:
    - name: Om oss
      pageRef: /om-oss
      weight: 10
    - name: Vår politik
      pageRef: /var-politik
      weight: 20
    - name: Blogg
      pageRef: /blogg
      weight: 30
    - name: Engagera dig
      pageRef: /engagera-dig
      weight: 40

permalinks:
  blogg: /blogg/:slug/

caches:
  images:
    dir: :cacheDir/images

markup:
  goldmark:
    renderer:
      unsafe: false
