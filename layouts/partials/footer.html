<footer class="site-footer">
  <div class="shell footer-grid">
    <div class="footer-brand">
      <img src="{{ "images/logo-white-wide.svg" | relURL }}" alt="Marxisterna" width="1887" height="301">
      <p>Marxism, radikalfeminism, antirasism och antiimperialism.</p>
    </div>
    <div>
      <p class="footer-heading">Genvägar</p>
      <ul class="footer-links">
        {{ range .Site.Menus.main }}
          <li><a href="{{ .URL }}">{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </div>
    <div>
      <p class="footer-heading">Kontakt</p>
      <p>Kontaktuppgifter publiceras snart.</p>
      <p class="footer-note">Inte bunden till något visst parti. Föreningen är under bildande.</p>
    </div>
  </div>
  <div class="shell footer-bottom">
    <p>© <span data-year>{{ now.Year }}</span> Marxisterna</p>
    <a href="#main">Till toppen ↑</a>
  </div>
</footer>
