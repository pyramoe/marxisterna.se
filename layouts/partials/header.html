<header class="site-header" data-header>
  <div class="shell header-inner">
    <a class="brand" href="{{ .Site.Home.RelPermalink }}" aria-label="Marxisterna, startsida">
      <img src="{{ "images/logo-red-wide.svg" | relURL }}" alt="Marxisterna" width="1887" height="301">
    </a>

    <button class="menu-button" type="button" aria-expanded="false" aria-controls="main-navigation" data-menu-button>
      <span class="menu-button__label">Meny</span>
      <span class="menu-button__icon" aria-hidden="true"><i></i><i></i></span>
    </button>

    <nav class="main-nav" id="main-navigation" aria-label="Huvudmeny" data-menu>
      <ul>
        {{ range .Site.Menus.main }}
          {{ $active := or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
          <li>
            <a href="{{ .URL }}"{{ if $active }} class="is-active" aria-current="page"{{ end }}>{{ .Name }}</a>
          </li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
